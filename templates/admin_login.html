<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · EliteProtech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 20% 0%, #1a2a4a 0%, #0b1220 55%, #060a14 100%);
    color: #e6edf7; overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow { position: fixed; width: 420px; height: 420px; border-radius: 50%; filter: blur(120px); z-index: 0; }
  .glow-1 { top: -120px; left: -80px; background: rgba(56,132,255,.28); }
  .glow-2 { bottom: -140px; right: -60px; background: rgba(0,255,190,.14); }

  .card {
    position: relative; z-index: 2; width: 400px;
    background: rgba(13,20,35,.82); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
    padding: 42px 38px 36px; box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo .mark {
    width: 62px; height: 62px; margin: 0 auto 14px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    font-size: 30px; font-weight: 800; color: #fff;
    box-shadow: 0 10px 30px rgba(59,130,246,.4);
  }
  .logo h1 { font-size: 22px; letter-spacing: .5px; }
  .logo p { color: #8a97ad; font-size: 13px; margin-top: 5px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #aab6c9; margin-bottom: 7px; text-transform: uppercase; letter-spacing: .6px; }
  .field input {
    width: 100%; padding: 13px 15px; font-size: 15px; color: #e6edf7;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; outline: none; transition: border .2s;
  }
  .field input:focus { border-color: #3b82f6; background: rgba(59,130,246,.06); }
  .btn {
    width: 100%; padding: 14px; margin-top: 8px; font-size: 15px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #3b82f6, #06b6d4);
    border: none; border-radius: 10px; cursor: pointer; transition: transform .15s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(59,130,246,.4); }
  .btn:active { transform: translateY(0); }
  .error { display: none; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
           color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .error.show { display: block; }
  .foot { text-align: center; margin-top: 20px; color: #5c6b82; font-size: 12px; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <div class="logo">
      <div class="mark">EP</div>
      <h1>Admin Control</h1>
      <p>EliteProtech Downloader · Restricted</p>
    </div>
    <div class="error" id="errBox">Invalid username or password</div>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="Enter username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
      </div>
      <button class="btn" type="submit">Sign In →</button>
    </form>
    <div class="foot">Authorized personnel only</div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errBox = document.getElementById('errBox');
    errBox.classList.remove('show');
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      if (res.ok) {
        window.location.href = '/admin/dashboard';
      } else {
        errBox.classList.add('show');
      }
    } catch (err) {
      errBox.classList.add('show');
    }
  });
</script>
</body>
</html>
